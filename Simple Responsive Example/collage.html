<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Picture Collage</title>
    <style>
        .section_class{
            display: flex;
            flex-direction: row;
            gap: 5px;
            border-radius: 5px;
        }
        .row{
            height: 400px;
            display: flex;
            gap: 5px;
            margin-bottom: 5px;
        }
        .collage-Vertical img{
            width: 50%;
            height: 50%;
            display: flex;
            flex-direction: row;
        }
        .Collage{
            display: flex;
            flex-direction: row;
            gap: 5px;
            border-radius: 5px;
        }
       
    </style>
</head>
<body>
    <header>
        <h3>My Picture Collages</h3>
    </header>
    <main>
        <section>
        <div class="row">
            <img src="images/1.JPG" alt="">
        </div>
        <section class="section_class">
        <div class="row">
            <img src="images/2.jpg" alt="">
            <img src="images/3.jpg" alt="">
        </div>

            <div class="collage-Vertical">
                <img src="images/4.jpg" alt="">
                <img src="images/8.jpg" alt="">
            </div>
        </section>
        </div>
        <div class="Collage">
            <img src="images/5.jpg" alt="">
            <img src="images/6.jpg" alt="">
            <img src="images/7.jpg" alt="">
        </div>
        </section>
    </main>
</body>
</html>
