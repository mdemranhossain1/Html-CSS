<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Position</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container {
            position: relative;
            width: 100%;
            height: 100vh;
        }
        .box {
            position: absolute;
            width: 100px;
            height: 100px;
            background-color: red;
        }
        .box1 {
            top: 20px;
            left: 20px;
        }
        .box2 {
            top: 50px;
            left: 50px;
        }
        .box3 {
            top: 80px;
            left: 80px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box box1"></div>
        <div class="box box2"></div>
        <div class="box box3"></div>
    </div>  
</body>
</html>
